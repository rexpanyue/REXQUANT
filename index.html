<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>游龙掠影 · 策略监控系统</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    background: #0f172a;
    color: #e2e8f0;
}

.container {
    display: flex;
    height: 100vh;
}

.left {
    width: 30%;
    background: #1e293b;
    padding: 20px;
    overflow-y: auto;
}

.right {
    width: 70%;
    padding: 20px;
}

h1 {
    text-align: center;
}

.stock-item {
    padding: 10px;
    margin: 5px 0;
    background: #334155;
    border-radius: 6px;
    cursor: pointer;
}

.stock-item:hover {
    background: #22c55e;
    color: #0f172a;
}

</style>
</head>

<body>

<h1 style="text-align:center;padding:10px;">游龙掠影 · 股票池实时查看</h1>

<div class="container">
<div class="left">
<h3>股票池</h3>
<div id="stockList">加载中...</div>
</div>

<div class="right">
<div id="tv_chart_container" style="height:100%;"></div>
</div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

function loadChart(code){
let symbol;

if(code.startsWith("6")){
symbol = "SSE:" + code;
}else{
symbol = "SZSE:" + code;
}

document.getElementById("tv_chart_container").innerHTML = "";

new TradingView.widget({
"container_id": "tv_chart_container",
"symbol": symbol,
"interval": "D",
"timezone": "Asia/Shanghai",
"theme": "dark",
"style": "1",
"locale": "zh_CN",
"autosize": true
});
}

fetch("stock_list.json")
.then(response => response.json())
.then(data => {
let container = document.getElementById("stockList");
container.innerHTML = "";

data.forEach(code => {
let div = document.createElement("div");
div.className = "stock-item";
div.innerText = code;
div.onclick = () => loadChart(code);
container.appendChild(div);
});

if(data.length > 0){
loadChart(data[0]);
}
})
.catch(err => {
document.getElementById("stockList").innerText = "无法加载股票池";
});

</script>

</body>
</html>
